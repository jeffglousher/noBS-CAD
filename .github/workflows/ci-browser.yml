name: Browser / WASM

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'crates/wasm/**'
      - 'crates/core/**'
      - 'crates/sketch/**'
      - 'crates/solid/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'scripts/smoke-wasm.mjs'
      - 'scripts/smoke-colink.mjs'
      - 'scripts/session-http-bridge.mjs'
      - '.cursor/environment.json'
      - '.github/workflows/ci-browser.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'crates/wasm/**'
      - 'crates/core/**'
      - 'crates/sketch/**'
      - 'crates/solid/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'scripts/smoke-wasm.mjs'
      - 'scripts/smoke-colink.mjs'
      - 'scripts/session-http-bridge.mjs'
      - '.cursor/environment.json'
      - '.github/workflows/ci-browser.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Install npm dependencies
        run: npm ci

      - name: Build WASM engine
        run: npm run build:wasm

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Knowledge check
        run: npm run check:knowledge

      - name: WASM smoke
        run: npm run smoke:wasm

      - name: Typecheck + production build
        run: npm run build

      - name: Co-link smoke (browser session bridge)
        run: npm run smoke:colink
