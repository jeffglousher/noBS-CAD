<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="Required flat race and funnel">
  <rect width="920" height="420" fill="#fbfaf6"/>
  <text x="24" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1f2933" font-size="16" font-weight="600">Fig. B2  Required stack — flat race, funnel opening, crowned roller, sides do not wrap</text>
  <rect x="80" y="300" width="520" height="57.6" fill="#f4d7b0" stroke="#8a5a1a"/>
  <rect x="80" y="300" width="520" height="6" fill="#c05621"/>
  <path d="M 120 210.72 L 134 300 L 120 300 Z" fill="#f4d7b0" stroke="#8a5a1a"/>
  <path d="M 560 210.72 L 546 300 L 560 300 Z" fill="#f4d7b0" stroke="#8a5a1a"/>
  <ellipse cx="300" cy="228" rx="72" ry="66.24000000000001" fill="rgba(15,107,76,0.28)" stroke="#0f6b4c" stroke-width="2"/>
  <rect x="140" y="161.76" width="400" height="10" fill="rgba(47,133,90,0.4)" stroke="#2f855a"/>
  <text x="150" y="151.76" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1f2933" font-size="12" fill="#0f6b4c">plate on the crown (rolling)</text>
  <text x="620" y="308" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1f2933" font-size="12">flat race land + 0.8 mm chamfer</text>
  <text x="620" y="222.72" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1f2933" font-size="12">funnel opening 20–30°</text>
  <text x="24" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1f2933" font-size="12" fill="#52606d">Cut a downward U-window through the fence only. Stop at the race face. Circumferential clearance ≥ 0.8 mm/side. Keepers touch ends, not the generator.</text>
  <text x="24" y="402" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1f2933" font-size="12" fill="#52606d">Small barrel crown (end drop 0.25–0.40 mm). Not a cone unless both races are also cones that share an apex.</text>
</svg>
