  <text x="24" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1f2933" font-size="12" fill="#52606d">ISO/TS 16281 logarithmic crown: z(x) = (Q/(π L E')) ln(1/(1−(2x/L)²)). FDM cannot hold that. A circular barrel with chamfered ends is the printable proxy.</text>
  <text x="24" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1f2933" font-size="12" fill="#52606d">Chamfer both ends 0.4–0.6 mm so keepers never see a sharp generator.</text>
